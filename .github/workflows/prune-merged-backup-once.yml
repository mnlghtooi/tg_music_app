name: One-time cleanup of merged backup branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-backup-once.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'mnlghtooi/tg_music_app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged PR and unchanged branch SHA before deletion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='test/library-backup-safety-v0.7.10'
          expected='ee022d444fccbce90b7666eb18fa725a8ff8cd77'
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/25" --jq '.merged')
          [[ "$actual" == "$expected" && "$merged" == true ]] || { echo 'Branch changed or PR not merged; abort'; exit 1; }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          echo 'Removed only verified merged backup branch.'
