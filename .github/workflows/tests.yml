name: Backend tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/music-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_transfer.cjs tests/test_entity_transfer.cjs tests/test_mini_seek.cjs tests/test_track_availability.cjs tests/test_artist_catalog.cjs tests/test_library_backup.cjs
      - run: node --check library_transfer.js && node --check migration_ui.js && node --check track_availability.js
      - run: python prepare_assets.py
